<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 274)">
    <!-- Tilted pastel pink flashcard behind cat -->
    <rect x="-156" y="-128" width="260" height="196" rx="30" fill="#fce7f3" stroke="#fbcfe8" stroke-width="6" transform="rotate(-11)"/>
    <!-- Little paw print on the flashcard corner -->
    <g transform="translate(-108 -106) rotate(-11)" fill="#f472b6" opacity="0.75">
      <ellipse cx="0" cy="6" rx="11" ry="9"/>
      <circle cx="-12" cy="-6" r="5"/>
      <circle cx="-4" cy="-11" r="5"/>
      <circle cx="5" cy="-11" r="5"/>
      <circle cx="13" cy="-6" r="5"/>
    </g>
    <!-- Cat head & ears -->
    <path d="M-122 -42 L-134 -158 L-46 -94 Q0 -110 46 -94 L134 -158 L122 -42 Q144 0 134 44 Q122 132 0 142 Q-122 132 -134 44 Q-144 0 -122 -42 Z" fill="#ffffff"/>
    <!-- Pink inner ears -->
    <path d="M-110 -56 L-118 -130 L-62 -88 Z" fill="#f9a8d4"/>
    <path d="M110 -56 L118 -130 L62 -88 Z" fill="#f9a8d4"/>
    <!-- Rosy cheeks -->
    <ellipse cx="-78" cy="42" rx="22" ry="13" fill="#f9a8d4" opacity="0.85"/>
    <ellipse cx="78" cy="42" rx="22" ry="13" fill="#f9a8d4" opacity="0.85"/>
    <!-- Eyes with kawaii shine -->
    <circle cx="-50" cy="10" r="18" fill="#3f1d38"/>
    <circle cx="-56" cy="4" r="6" fill="#ffffff"/>
    <circle cx="50" cy="10" r="18" fill="#3f1d38"/>
    <circle cx="44" cy="4" r="6" fill="#ffffff"/>
    <!-- Pink nose -->
    <path d="M-15 46 Q0 40 15 46 L0 64 Z" fill="#ec4899"/>
    <!-- Cute :3 mouth -->
    <path d="M0 62 Q-12 82 -32 76 M0 62 Q12 82 32 76" stroke="#3f1d38" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Whiskers -->
    <path d="M-104 28 L-148 20 M-106 46 L-152 48 M104 28 L148 20 M106 46 L152 48" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
